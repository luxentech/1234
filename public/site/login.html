<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elevate — تسجيل الدخول وإنشاء حساب</title>
  <meta name="description" content="سجل دخولك إلى منصة Elevate للوصول إلى المسابقات، الدورات، والفرص الحصرية.">
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="elevate-boost.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #090d16;
      font-family: 'Cairo', sans-serif;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }
    .login-container {
      width: 100%;
      max-width: 480px;
      padding: 20px;
      position: relative;
      z-index: 10;
    }
    .back-home-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #94a3b8;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 20px;
      transition: all 0.2s ease;
    }
    .back-home-link:hover {
      color: #38bdf8;
      transform: translateX(4px);
    }
    .login-auth-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 36px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(56, 189, 248, 0.1);
    }
    .brand-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #fff;
    }
    .logo-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      color: #fff;
      box-shadow: 0 8px 16px rgba(56, 189, 248, 0.3);
    }
    .brand-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-badge {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: #38bdf8;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .tab-switcher {
      display: flex;
      background: rgba(2, 6, 23, 0.6);
      border-radius: 14px;
      padding: 5px;
      position: relative;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .tab-indicator {
      position: absolute;
      top: 5px;
      right: 5px;
      width: calc(50% - 5px);
      height: calc(100% - 10px);
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      border-radius: 10px;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 0;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      position: relative;
      z-index: 2;
      transition: color 0.2s ease;
    }
    .tab-btn.active {
      color: #fff;
    }
    .form-heading {
      margin-bottom: 20px;
    }
    .form-heading h2 {
      font-size: 1.4rem;
      margin: 0 0 6px;
      color: #fff;
    }
    .form-heading p {
      font-size: 0.9rem;
      color: #94a3b8;
      margin: 0;
    }
    .form-content {
      display: none;
    }
    .form-content.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .input-group {
      margin-bottom: 16px;
      text-align: right;
    }
    .input-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-field {
      width: 100%;
      padding: 12px 42px 12px 14px;
      background: rgba(2, 6, 23, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }
    .input-field:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
      background: rgba(2, 6, 23, 0.8);
    }
    .input-icon-right {
      position: absolute;
      right: 14px;
      color: #64748b;
      font-size: 1rem;
      pointer-events: none;
    }
    .toggle-password {
      position: absolute;
      left: 12px;
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 1rem;
      padding: 4px;
    }
    .toggle-password:hover {
      color: #94a3b8;
    }
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 16px 0 20px;
      font-size: 0.85rem;
    }
    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: #cbd5e1;
    }
    .remember-me input {
      accent-color: #38bdf8;
    }
    .forgot-link {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
    }
    .forgot-link:hover {
      text-decoration: underline;
    }
    .btn-submit {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
      transition: all 0.2s ease;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.45);
    }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 24px 0 18px;
      color: #64748b;
      font-size: 0.85rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .divider span {
      padding: 0 12px;
    }
    .social-btn {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      color: #f1f5f9;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
    }
    .social-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }
    .alert-box {
      display: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      margin-bottom: 16px;
      text-align: right;
    }
    .alert-box.info {
      display: block;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
    }
    .alert-box.error {
      display: block;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }
    .alert-box.success {
      display: block;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #22c55e;
    }
  </style>
</head>
<body>
  <!-- Ambient background glow -->
  <div class="bg-canvas" style="position: fixed; inset: 0; z-index: 1; pointer-events: none;">
    <div class="glow-orb glow-1" style="position: absolute; top: 10%; right: 15%; width: 400px; height: 400px; background: radial-gradient(circle, rgba(56,189,248,0.15), transparent 70%);"></div>
    <div class="glow-orb glow-2" style="position: absolute; bottom: 10%; left: 15%; width: 500px; height: 500px; background: radial-gradient(circle, rgba(99,102,241,0.15), transparent 70%);"></div>
  </div>

  <div class="login-container">
    <a href="index.html" class="back-home-link">
      <i class="fa-solid fa-arrow-right"></i>
      <span>العودة إلى الصفحة الرئيسية</span>
    </a>

    <div class="card login-auth-card">
      <div class="brand-header">
        <a href="index.html" class="brand-logo">
          <div class="logo-icon-box">
            <i class="fa-solid fa-rocket"></i>
          </div>
          <span class="brand-title">Elevate</span>
        </a>
        <span class="brand-badge">الجيل القادم</span>
      </div>

      <div class="tab-switcher">
        <div class="tab-indicator" id="tabIndicator"></div>
        <button type="button" class="tab-btn active" id="loginTabBtn" onclick="switchTab('login')">
          تسجيل الدخول
        </button>
        <button type="button" class="tab-btn" id="registerTabBtn" onclick="switchTab('register')">
          حساب جديد
        </button>
      </div>

      <div id="alertBox" class="alert-box"></div>

      <!-- Login Form -->
      <div id="loginForm" class="form-content active">
        <div class="form-heading">
          <h2>أهلاً بك مجدداً! 👋</h2>
          <p>أدخل بياناتك للاستمرار في رحلة التعلم والتطوير</p>
        </div>

        <form id="loginFormElement" onsubmit="handleLoginSubmit(event)">
          <div class="input-group">
            <label class="input-label">اسم المستخدم، البريد أو الهاتف</label>
            <div class="input-wrapper">
              <input type="text" id="loginIdentifier" class="input-field" placeholder="اسم المستخدم أو البريد أو الهاتف" required autocomplete="username">
              <i class="fa-regular fa-user input-icon-right"></i>
            </div>
          </div>

          <div class="input-group">
            <label class="input-label">كلمة المرور</label>
            <div class="input-wrapper">
              <input type="password" id="loginPassword" class="input-field" placeholder="••••••••" required autocomplete="current-password">
              <i class="fa-solid fa-lock input-icon-right"></i>
              <button type="button" class="toggle-password" onclick="togglePassword('loginPassword', this)">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" id="rememberMe" checked>
              <span>تذكر جلسة الدخول</span>
            </label>
            <a href="#" class="forgot-link" onclick="handleForgot(event)">نسيت كلمة المرور؟</a>
          </div>

          <button type="submit" class="btn-submit" id="loginSubmitBtn">
            <span>تسجيل الدخول</span>
            <i class="fa-solid fa-arrow-left"></i>
          </button>
        </form>

        <div class="divider">
          <span>أو المتابعة باستخدام</span>
        </div>

        <button type="button" class="social-btn" onclick="handleGoogleSignIn()">
          <svg width="20" height="20" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          <span>تسجيل الدخول بواسطة Google</span>
        </button>
      </div>

      <!-- Register Form -->
      <div id="registerForm" class="form-content">
        <div class="form-heading">
          <h2>انضم إلى Elevate 🚀</h2>
          <p>ابدأ رحلتك واستكشف الفرص والدورات التعليمية</p>
        </div>

        <form id="registerFormElement" onsubmit="handleRegisterSubmit(event)">
          <div class="input-group">
            <label class="input-label">الاسم الكامل</label>
            <div class="input-wrapper">
              <input type="text" id="regFullName" class="input-field" placeholder="مثال: أحمد محمد" required autocomplete="name">
              <i class="fa-regular fa-id-card input-icon-right"></i>
            </div>
          </div>

          <div class="input-group">
            <label class="input-label">اسم المستخدم (باللغة الإنجليزية)</label>
            <div class="input-wrapper">
              <input type="text" id="regUsername" class="input-field" placeholder="ahmed123" required autocomplete="username" dir="ltr">
              <i class="fa-solid fa-at input-icon-right"></i>
            </div>
          </div>

          <div class="input-group">
            <label class="input-label">البريد الإلكتروني (اختياري)</label>
            <div class="input-wrapper">
              <input type="email" id="regEmail" class="input-field" placeholder="name@example.com" autocomplete="email" dir="ltr">
              <i class="fa-regular fa-envelope input-icon-right"></i>
            </div>
          </div>

          <div class="input-group">
            <label class="input-label">رقم الهاتف</label>
            <div class="input-wrapper">
              <input type="tel" id="regPhone" class="input-field" placeholder="01XXXXXXXXX" required autocomplete="tel" dir="ltr">
              <i class="fa-solid fa-phone input-icon-right"></i>
            </div>
          </div>

          <div class="input-group">
            <label class="input-label">كلمة المرور (8 أحرف على الأقل)</label>
            <div class="input-wrapper">
              <input type="password" id="regPassword" class="input-field" placeholder="••••••••" required autocomplete="new-password">
              <i class="fa-solid fa-lock input-icon-right"></i>
              <button type="button" class="toggle-password" onclick="togglePassword('regPassword', this)">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="input-group">
            <label class="input-label">تأكيد كلمة المرور</label>
            <div class="input-wrapper">
              <input type="password" id="regConfirmPassword" class="input-field" placeholder="••••••••" required autocomplete="new-password">
              <i class="fa-solid fa-shield-halved input-icon-right"></i>
            </div>
          </div>

          <button type="submit" class="btn-submit" id="regSubmitBtn" style="margin-top: 10px;">
            <span>إنشاء الحساب</span>
            <i class="fa-solid fa-user-plus"></i>
          </button>
        </form>

        <div class="divider">
          <span>أو التسجيل السريع بواسطة</span>
        </div>

        <button type="button" class="social-btn" onclick="handleGoogleSignIn()">
          <svg width="20" height="20" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          <span>التسجيل بواسطة Google</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    function showAlert(msg, type) {
      const box = document.getElementById("alertBox");
      if (!box) return;
      box.textContent = msg;
      box.className = "alert-box " + (type || "info");
      box.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function switchTab(tab) {
      const indicator = document.getElementById("tabIndicator");
      const loginBtn = document.getElementById("loginTabBtn");
      const regBtn = document.getElementById("registerTabBtn");
      const loginForm = document.getElementById("loginForm");
      const regForm = document.getElementById("registerForm");
      const alertBox = document.getElementById("alertBox");
      if (alertBox) alertBox.className = "alert-box";

      if (tab === "register") {
        indicator.style.transform = "translateX(-100%)";
        loginBtn.classList.remove("active");
        regBtn.classList.add("active");
        loginForm.classList.remove("active");
        regForm.classList.add("active");
      } else {
        indicator.style.transform = "translateX(0)";
        regBtn.classList.remove("active");
        loginBtn.classList.add("active");
        regForm.classList.remove("active");
        loginForm.classList.add("active");
      }
    }

    function togglePassword(inputId, btn) {
      const field = document.getElementById(inputId);
      const icon = btn.querySelector("i");
      if (!field) return;
      if (field.type === "password") {
        field.type = "text";
        if (icon) icon.className = "fa-regular fa-eye-slash";
      } else {
        field.type = "password";
        if (icon) icon.className = "fa-regular fa-eye";
      }
    }

    function saveSessionAndRedirect(user) {
      try {
        localStorage.setItem("ns_user", JSON.stringify(user));
        if (user.adminToken) {
          localStorage.setItem("ns_admin_token", user.adminToken);
          localStorage.setItem("ns_backup_token", user.adminToken);
        }
      } catch (e) {}
      showAlert("تم بنجاح! جاري تحويلك للصفحة الرئيسية...", "success");
      setTimeout(function () {
        window.location.href = "index.html";
      }, 700);
    }

    function handleLoginSubmit(event) {
      event.preventDefault();
      const identifier = document.getElementById("loginIdentifier").value.trim();
      const password = document.getElementById("loginPassword").value.trim();

      if (!identifier || !password) {
        showAlert("يرجى إدخال اسم المستخدم وكلمة المرور.", "error");
        return;
      }

      showAlert("جاري التحقق من البيانات بقاعدة البيانات...", "info");
      const btn = document.getElementById("loginSubmitBtn");
      if (btn) btn.disabled = true;

      fetch("/api/public/auth", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "login", identifier: identifier, password: password })
      })
      .then(function (res) { return res.json().then(function (d) { return { ok: res.ok, data: d }; }); })
      .then(function (result) {
        if (btn) btn.disabled = false;
        if (result.ok && result.data && result.data.user) {
          saveSessionAndRedirect(result.data.user);
        } else {
          showAlert((result.data && result.data.error) || "بيانات الدخول غير صحيحة، يرجى المحاولة مجدداً.", "error");
        }
      })
      .catch(function () {
        if (btn) btn.disabled = false;
        showAlert("تعذر الاتصال بالسيرفر، تأكد من تشغيل السيرفر وحاول ثانية.", "error");
      });
    }

    function handleRegisterSubmit(event) {
      event.preventDefault();
      const fullName = document.getElementById("regFullName").value.trim();
      const username = document.getElementById("regUsername").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const phone = document.getElementById("regPhone").value.trim();
      const password = document.getElementById("regPassword").value;
      const confirmPassword = document.getElementById("regConfirmPassword").value;

      if (password.length < 8) {
        showAlert("كلمة المرور يجب أن تكون 8 أحرف على الأقل.", "error");
        return;
      }
      if (password !== confirmPassword) {
        showAlert("كلمتا المرور غير متطابقتين!", "error");
        return;
      }

      showAlert("جاري حفظ الحساب في قاعدة البيانات...", "info");
      const btn = document.getElementById("regSubmitBtn");
      if (btn) btn.disabled = true;

      fetch("/api/public/auth", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "register",
          fullName: fullName,
          username: username,
          email: email,
          phone: phone,
          password: password
        })
      })
      .then(function (res) { return res.json().then(function (d) { return { ok: res.ok, data: d }; }); })
      .then(function (result) {
        if (btn) btn.disabled = false;
        if (result.ok && result.data && result.data.user) {
          showAlert("تم إنشاء الحساب وحفظه في قاعدة البيانات بنجاح!", "success");
          saveSessionAndRedirect(result.data.user);
        } else {
          showAlert((result.data && result.data.error) || "تعذر إنشاء الحساب، قد يكون اسم المستخدم مسجلاً مسبقاً.", "error");
        }
      })
      .catch(function () {
        if (btn) btn.disabled = false;
        showAlert("تعذر الاتصال بالسيرفر وقاعدة البيانات.", "error");
      });
    }

    function handleGoogleSignIn() {
      var name = prompt("أدخل اسمك لتسجيل الدخول الفوري بحساب Google:", "مستخدم جوجل");
      if (!name) return;
      var email = prompt("أدخل بريدك الإلكتروني لـ Google:", name.replace(/\\s+/g, "").toLowerCase() + "@gmail.com");
      if (!email) return;

      showAlert("جاري تسجيل الدخول بحساب Google وحفظه في قاعدة البيانات...", "info");
      fetch("/api/public/auth", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "google",
          googleUser: {
            email: email,
            name: name,
            sub: "google_" + Date.now()
          }
        })
      })
      .then(function (res) { return res.json().then(function (d) { return { ok: res.ok, data: d }; }); })
      .then(function (result) {
        if (result.ok && result.data && result.data.user) {
          saveSessionAndRedirect(result.data.user);
        } else {
          showAlert((result.data && result.data.error) || "تعذر تسجيل الدخول بواسطة Google.", "error");
        }
      })
      .catch(function () {
        showAlert("حدث خطأ أثناء الاتصال بالسيرفر.", "error");
      });
    }

    function handleForgot(event) {
      event.preventDefault();
      const identifier = document.getElementById("loginIdentifier").value.trim();
      if (!identifier) {
        showAlert("اكتب اسم المستخدم أو بريدك في الحقل أولاً لطلب استعادة كلمة المرور.", "error");
        return;
      }
      fetch("/api/public/auth", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "request_password_reset", identifier: identifier })
      })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        showAlert(data.message || "تم إرسال طلب استعادة كلمة المرور للإدارة.", "info");
      })
      .catch(function () {
        showAlert("تعذر إرسال الطلب، تأكد من الاتصال بالإنترنت.", "error");
      });
    }
  </script>
</body>
</html>
